name: Build Windows exe
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: python tools/build_exe.py
      - name: Smoke test
        shell: pwsh
        run: |
          cd release/HeroRunLive
          $p = Start-Process -FilePath .\HeroRunLive.exe -ArgumentList '--smoke' -PassThru -Wait
          Get-Content smoke.txt
          if (Test-Path error.log) { Get-Content error.log }
          if ($p.ExitCode -ne 0) { exit 1 }
          Remove-Item smoke.txt, config.json -ErrorAction SilentlyContinue
          Remove-Item -Recurse voice_cache -ErrorAction SilentlyContinue
      - name: Nén zip
        shell: pwsh
        run: Compress-Archive -Path release/HeroRunLive -DestinationPath HeroRunLive-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HeroRunLive-win64
          path: HeroRunLive-win64.zip
          retention-days: 30
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HeroRunLive-win64.zip
