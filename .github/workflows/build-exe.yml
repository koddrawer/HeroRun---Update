name: Build Windows exe
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: python tools/build_exe.py
      - name: Smoke test
        shell: pwsh
        run: |
          cd release/HeroRunLive
          $p = Start-Process -FilePath .\HeroRunLive.exe -ArgumentList '--smoke' -PassThru -Wait
          Get-Content smoke.txt
          if (Test-Path error.log) { Get-Content error.log }
          if ($p.ExitCode -ne 0) { exit 1 }
          Remove-Item smoke.txt, config.json -ErrorAction SilentlyContinue
          Remove-Item -Recurse voice_cache -ErrorAction SilentlyContinue
      - name: Nén zip
        shell: pwsh
        run: Compress-Archive -Path release/HeroRunLive -DestinationPath HeroRunLive-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HeroRunLive-win64
          path: HeroRunLive-win64.zip
          retention-days: 30
      - name: Đọc phiên bản
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content version.json | ConvertFrom-Json).version
          "v=$v" >> $env:GITHUB_OUTPUT
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Hero Run Live v${{ steps.ver.outputs.v }} (Windows)
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Tải **HeroRunLive-win64.zip** → giải nén → chạy **HeroRunLive.exe**.
            Giữ nguyên thư mục `_internal`, `app`, `assets`, `music` cạnh file exe. App tự cập nhật nóng từ repo này.
          files: HeroRunLive-win64.zip
